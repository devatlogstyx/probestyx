server:
  port: 9200
  cache_ttl: 15
  #secret: "your-secret-key-here"  # Leave empty or remove for no authentication

  # Optional: only needed if more than one monitoring backend polls this instance
  # and uses the format: log scrapers below (nginx_errors/docker_errors). Each
  # listed ID gets its own independent tailing position via ?callerId=<id> -
  # see the README's "Per-Consumer Tailing" section.
  # consumers:
  #   - logstyx-prod
  #   - staging-poller

# Optional: pushes new lines from format: log scrapers (marked push: true
# below) straight to Logstyx as they appear - event-driven for type: file
# sources (nginx_errors), polled on command_poll_interval_seconds for
# type: command sources (docker_errors) - instead of waiting for /metrics to
# be polled. secret here is the Logstyx PROJECT secret from the dashboard,
# distinct from server.secret above (that one authenticates callers of THIS
# instance's /metrics; this one authenticates probestyx AS a caller of
# Logstyx). See the README's "Push Mode" section for the full reliability
# notes (in-memory-only retry queue, 401 is treated as fatal, etc).
# push:
#   enabled: true
#   endpoint: "https://api.logstyx.com/api/v1/logs"
#   project_id: "your-project-id"
#   secret: "your-project-secret"
#   level: "error"
#   context:
#     environment: "production"

system:
  enabled: true
  metrics:
    # CPU Metrics
    - cpu_usage_percent
    - cpu_usage_per_core
    - cpu_count
    - cpu_count_physical
    - cpu_load_1min
    - cpu_load_5min
    - cpu_load_15min
    
    # Memory Metrics
    - ram_usage_percent
    - available_ram_mb
    - total_ram_mb
    - ram_cached_mb
    - ram_buffers_mb
    - swap_usage_percent
    - swap_total_mb
    - swap_used_mb
    
    # Disk Metrics
    - disk_usage_percent
    - available_disk_gb
    - total_disk_gb
    - inode_usage_percent
    - disk_read_bytes
    - disk_write_bytes
    - disk_read_bytes_per_sec
    - disk_write_bytes_per_sec
    - disk_read_count
    - disk_write_count
    
    # Network Metrics
    - network_bytes_sent
    - network_bytes_recv
    - network_bytes_sent_per_sec
    - network_bytes_recv_per_sec
    - network_packets_sent
    - network_packets_recv
    - network_errors_in
    - network_errors_out
    - active_connections
    
    # System Info
    - system_uptime_seconds
    - boot_time_unix
    - os_platform
    - os_version
    - hostname
    - kernel_version
    - process_count

scrapers:
  # Example 1: JSON from URL
  - name: api_metrics
    source:
      type: url
      url: "https://api.example.com/metrics"
      format: json
    metrics:
      - path: "response.time"
        name: "api_response_time"
      - path: "database.connections"
        name: "db_connections"
      - path: "cache.hit_rate"
        name: "cache_hit_rate"
        calculate: "value * 100"  # Convert to percentage

  # Example 2: JSON from local file
  - name: app_stats
    source:
      type: file
      path: "/var/log/app/stats.json"
      format: json
    metrics:
      - path: "requests.total"
        name: "total_requests"
      - path: "requests.failed"
        name: "failed_requests"
      - path: "uptime"
        name: "app_uptime_seconds"
    filter:
      include:
        - ".*requests.*"
      exclude:
        - ".*internal.*"

  # Example 3: Prometheus format from URL
  - name: node_exporter
    source:
      type: url
      url: "http://localhost:9100/metrics"
      format: prometheus
    metrics:
      - match: "node_cpu_seconds_total"
        name: "node_cpu_total"
      - match: "node_memory_MemAvailable_bytes"
        name: "node_memory_available"
        calculate: "value / 1024 / 1024"  # Convert to MB
      - match: "node_disk_read_bytes_total"
        name: "node_disk_read_mb"
        calculate: "value / 1024 / 1024"

  # Example 4: Prometheus format from file
  - name: custom_metrics
    source:
      type: file
      path: "/var/lib/prometheus/custom.prom"
      format: prometheus
    metrics:
      - match: "http_requests_total"
        name: "http_requests"
      - match: "http_request_duration_seconds"
        name: "http_duration_ms"
        calculate: "value * 1000"  # Convert seconds to milliseconds

  # Example 5: Raw format with default pattern (key=value)
  - name: system_info
    source:
      type: file
      path: "/proc/meminfo"
      format: raw
      # Default pattern: (\w+)=(\S+)
    metrics:
      - match: "MemTotal"
        name: "system_memory_total_kb"
      - match: "MemFree"
        name: "system_memory_free_kb"
      - match: "SwapTotal"
        name: "system_swap_total_kb"

  # Example 6: Raw format with custom regex pattern
  - name: nginx_status
    source:
      type: url
      url: "http://localhost/nginx_status"
      format: raw
      pattern: '(\w+):\s*(\d+)'  # Match "Active connections: 123"
    metrics:
      - match: "Active"
        name: "nginx_active_connections"
      - match: "Reading"
        name: "nginx_reading"
      - match: "Writing"
        name: "nginx_writing"
      - match: "Waiting"
        name: "nginx_waiting"

  # Example 7: Log file parsing
  - name: error_logs
    source:
      type: file
      path: "/var/log/app/error.log"
      format: raw
      pattern: 'ERROR.*count=(\d+).*severity=(\w+)'
    metrics:
      - match: "count"
        name: "error_count"
      - match: "severity"
        name: "error_severity"

  # Example 7b: nginx error log - list only new matching lines since the last
  # scrape, plus a count. File sources are tailed automatically: the first
  # scrape after startup seeds the read position at end-of-file (reports
  # nothing), and each scrape after that only sees newly appended lines.
  - name: nginx_errors
    source:
      type: file
      path: "/var/log/nginx/error.log"
      format: log
      max_lines: 50          # cap on lines returned per scrape; count still reflects the true total
      # pattern: '\[error\]' # optional regex; default matches lines containing "error" (case-insensitive)
    metrics:
      - match: "count"
        name: "nginx_error_count"
      - match: "lines"
        name: "nginx_error_lines"
    # push: true  # also send new lines to Logstyx as they're written (needs the top-level push: section above enabled)

  # Example 7c: Docker container logs - list only new matching lines since the
  # last scrape. {{since}} is substituted with the timestamp of this scraper's
  # last successful run, so each scrape only asks docker for what's new.
  - name: docker_errors
    source:
      type: command
      command: "docker logs --since {{since}} --tail 1000 my-container 2>&1"
      format: log
      max_lines: 50
    metrics:
      - match: "count"
        name: "docker_error_count"
      - match: "lines"
        name: "docker_error_lines"
    # push: true  # command sources are re-polled on push.command_poll_interval_seconds instead of file-watched (needs the top-level push: section above enabled)

  # Example 8: Custom application metrics (JSON)
  - name: webapp_metrics
    source:
      type: url
      url: "http://localhost:8080/internal/metrics"
      format: json
    metrics:
      - path: "performance.avg_response_time"
        name: "webapp_avg_response_ms"
      - path: "users.active"
        name: "webapp_active_users"
      - path: "queue.size"
        name: "webapp_queue_size"
      - path: "queue.processing_time"
        name: "webapp_queue_process_time"
        calculate: "value / 1000"  # microseconds to milliseconds
    filter:
      include:
        - "webapp_.*"

  # Example 9: Database metrics (JSON with nested paths)
  - name: database_stats
    source:
      type: url
      url: "http://db-server:5000/stats"
      format: json
    metrics:
      - path: "connections.active"
        name: "db_active_connections"
      - path: "connections.idle"
        name: "db_idle_connections"
      - path: "queries.per_second"
        name: "db_queries_per_sec"
      - path: "replication.lag"
        name: "db_replication_lag_ms"
      - path: "cache.size_bytes"
        name: "db_cache_size_mb"
        calculate: "value / 1024 / 1024"

  # Example 10: IoT Device metrics (raw format)
  - name: iot_sensors
    source:
      type: file
      path: "/data/sensors/current.txt"
      format: raw
      pattern: 'sensor_(\w+)=([0-9.]+)'
    metrics:
      - match: "temperature"
        name: "iot_temperature_celsius"
      - match: "humidity"
        name: "iot_humidity_percent"
      - match: "pressure"
        name: "iot_pressure_hpa"
      - match: "battery"
        name: "iot_battery_percent"

  # Example 11: Multiple calculations
  - name: performance_metrics
    source:
      type: url
      url: "https://api.example.com/performance"
      format: json
    metrics:
      - path: "latency.p50"
        name: "latency_p50_ms"
      - path: "latency.p95"
        name: "latency_p95_ms"
      - path: "latency.p99"
        name: "latency_p99_ms"
      - path: "throughput"
        name: "throughput_req_per_sec"
        calculate: "value / 60"  # Convert per minute to per second
      - path: "bandwidth.bytes"
        name: "bandwidth_mbps"
        calculate: "value * 8 / 1000000"  # bytes to megabits

  # Example 12: Filtered Prometheus metrics
  - name: kubernetes_metrics
    source:
      type: url
      url: "http://k8s-metrics:9090/metrics"
      format: prometheus
    metrics:
      - match: "kube_pod_status_ready"
        name: "k8s_pods_ready"
      - match: "kube_deployment_replicas"
        name: "k8s_deployment_replicas"
      - match: "kube_node_status_allocatable_cpu_cores"
        name: "k8s_allocatable_cpu"
    filter:
      include:
        - "kube_.*"
        - "k8s_.*"
      exclude:
        - ".*_bucket$"
        - ".*_sum$"
        - ".*_count$"